name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy nota-core
        run: cargo clippy -p nota-core --all-targets --all-features -- -D warnings

      - name: Test nota-core
        run: cargo test -p nota-core --all-features

      - name: Check wasm Adapter
        run: cargo check --target wasm32-unknown-unknown --all-features

      - name: Verify AppDir contract
        run: python3 build-aux/test_package_appimage.py

  native:
    # Relm4: https://relm4.org/book/stable/continuous_integration.html
    # Use the gtk4-rs image so GTK/libadwaita match gnome_50, not Ubuntu LTS.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/gtk-rs/gtk4-rs/gtk4:latest
    env:
      DISPLAY: ":99.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install WebKitGTK 6
        run: dnf install --assumeyes webkitgtk6.0-devel

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: xvfb-run --auto-servernum cargo test --workspace --all-features

      - uses: bcomnes/cleanup-xvfb@v1.0.9
