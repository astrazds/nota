name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy nota-core
        run: cargo clippy -p nota-core --all-targets --all-features -- -D warnings

      - name: Test nota-core
        run: cargo test -p nota-core --all-features

      - name: Check wasm Adapter
        run: cargo check --target wasm32-unknown-unknown --all-features

      - name: Verify AppDir contract
        run: python3 build-aux/test_package_appimage.py

  native:
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install GTK 4 and WebKitGTK 6
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: xvfb-run -a cargo test --workspace --all-features
