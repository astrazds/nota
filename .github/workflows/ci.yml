name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up repository tools
        uses: jdx/mise-action@v4

      - name: Set up Rust checks
        run: mise run setup:rust

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: mise run fmt

      - name: Clippy nota-core
        run: mise run clippy:core

      - name: Test nota-core
        run: mise run test:core

      - name: Check wasm Adapter
        run: mise run check:web

      - name: Verify AppDir contract
        run: mise run test:package

  native:
    # Relm4: https://relm4.org/book/stable/continuous_integration.html
    # Use the gtk4-rs image so GTK/libadwaita match gnome_50, not Ubuntu LTS.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/gtk-rs/gtk4-rs/gtk4:latest
    env:
      DISPLAY: ":99.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up repository tools
        uses: jdx/mise-action@v4

      - name: Set up Rust checks
        run: mise run setup:rust

      - name: Install WebKitGTK 6
        run: dnf install --assumeyes webkitgtk6.0-devel

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy workspace
        run: mise run clippy

      - name: Test workspace
        run: xvfb-run --auto-servernum mise run test

      - uses: bcomnes/cleanup-xvfb@v1.0.9
