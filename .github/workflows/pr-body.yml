name: Pull request signature

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  signature:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test the signature check
        run: node --test scripts/check-pr-body.test.mjs

      - name: Reject an agent footer in the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node scripts/check-pr-body.mjs
