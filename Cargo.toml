[package]
name = "noter"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
leptos = { version = "0.8.19", features = ["csr"] }
wasm-bindgen = "0.2.120"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
gloo-storage = "0.4.0"
uuid = { version = "1.23.1", features = ["v4", "js", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
pulldown-cmark = "0.13.3"
web-sys = { version = "0.3.97", features = ["HtmlTextAreaElement", "Selection", "Range", "Window", "Document", "Node", "NodeList", "Element", "Event", "EventTarget", "HtmlInputElement", "MediaQueryList", "console"] }
