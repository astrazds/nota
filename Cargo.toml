[package]
name = "noter"
version = "0.8.0"
edition = "2024"
rust-version = "1.95"
authors = ["Andrejs Strazds"]
description = "A local-first Markdown note-taking web app built with Rust, Leptos, and Tailwind CSS."
license = "MIT"
repository = "https://github.com/astrazds/noter-leptos-md"
readme = "README.md"
keywords = ["notes", "markdown", "leptos", "wasm", "tailwindcss"]
categories = ["wasm", "web-programming"]

[dependencies]
leptos = { version = "0.8.19", features = ["csr"] }
wasm-bindgen = "0.2.120"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
gloo-storage = "0.4.0"
uuid = { version = "1.23.1", features = ["v4", "js", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
pulldown-cmark = "0.13.3"
web-sys = { version = "0.3.97", features = ["HtmlTextAreaElement", "Selection", "Range", "Window", "Document", "Node", "NodeList", "Element", "Event", "EventTarget", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "File", "FileList", "FileReader", "ProgressEvent", "MediaQueryList", "console"] }
