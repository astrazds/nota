[package]
name = "noter"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8.15", features = ["csr"] }
wasm-bindgen = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
gloo-storage = "0.3.0"
uuid = { version = "1.21.0", features = ["v4", "js", "serde"] }
chrono = { version = "0.4.43", features = ["serde"] }
pulldown-cmark = "0.13.0"
web-sys = { version = "0.3.85", features = ["HtmlTextAreaElement", "Selection", "Range", "Window", "Document", "Node", "NodeList", "Element", "Event", "EventTarget", "HtmlInputElement", "MediaQueryList", "console"] }
