[package]
name = "nota-desktop"
version = "2.0.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native Linux GTK4 frontend for Nota, a local-first Markdown note app"

[features]
default = ["preview-webkit"]
gui = ["dep:pango", "dep:relm4"]
preview-webkit = ["gui", "dep:webkit6"]

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
nota-app = { path = "../nota-app" }
nota-core = { path = "../nota-core" }
pango = { version = "0.22.9", features = ["v1_56"], optional = true }
relm4 = { version = "0.11.0", features = ["gnome_50"], optional = true }
url = "2.5.7"
uuid = "1.23.1"
webkit6 = { version = "0.6.1", optional = true }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true

[[bin]]
name = "nota-desktop"
path = "src/main.rs"
required-features = ["gui"]
