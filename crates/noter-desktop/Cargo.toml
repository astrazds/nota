[package]
name = "noter-desktop"
version = "2.0.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux-first Relm4/GTK4 desktop application for Nota"

[features]
default = ["gui"]
gui = ["dep:pango", "dep:relm4"]
preview-webkit = ["gui", "dep:webkit6"]

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
noter-core = { path = "../noter-core" }
pango = { version = "0.22.9", features = ["v1_56"], optional = true }
relm4 = { version = "0.11.0", features = ["gnome_50"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.7"
uuid = "1.23.1"
webkit6 = { version = "0.6.1", optional = true }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true

[[bin]]
name = "noter-desktop"
path = "src/main.rs"
required-features = ["gui"]
